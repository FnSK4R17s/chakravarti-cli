[package]
name = "ckrv-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Transport abstraction layer for Chakravarti CLI - shared handlers for Axum and Tauri backends"

[features]
default = []
# Axum HTTP/WebSocket transport
axum = ["dep:axum", "dep:tower-http"]
# Tauri IPC transport
tauri = ["dep:tauri"]
# TypeScript type generation
typescript = ["dep:ts-rs"]

[dependencies]
# Serialization (required)
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Time utilities
chrono.workspace = true

# UUID generation
uuid = { workspace = true }

# Futures utilities
futures-util.workspace = true

# Internal crates
ckrv-core = { workspace = true }
ckrv-sandbox = { workspace = true }
ckrv-git = { workspace = true }
ckrv-metrics = { workspace = true }

# Docker operations
bollard = { workspace = true }

# Optional: Axum transport
axum = { version = "0.8.4", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
tokio-stream = { version = "0.1.17", features = ["sync"] }

# Optional: Tauri transport  
tauri = { version = "2.0", optional = true }

# Optional: TypeScript generation
ts-rs = { version = "10.1", features = ["serde-compat", "serde-json-impl"], optional = true }

# HTTP client for external APIs
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Shell escaping
shell-escape = "0.1"

# Directory utilities
dirs = "6.0"

# Base64 encoding
base64 = "0.22"

# Lazy initialization
once_cell = "1.20"

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true
