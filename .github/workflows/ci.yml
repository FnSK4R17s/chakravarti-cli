name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  # ── Rust Format ────────────────────────────────────────────────────────
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Rust Lint ──────────────────────────────────────────────────────────
  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - run: cargo clippy --workspace --exclude ckrv-tauri -- -D warnings

  # ── Rust Tests ─────────────────────────────────────────────────────────
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - name: Build tests
        run: cargo test --workspace --exclude ckrv-tauri --no-run
      - name: Run tests
        run: cargo test --workspace --exclude ckrv-tauri

  # ── Rust Build ─────────────────────────────────────────────────────────
  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - run: cargo build --release -p ckrv-cli
      - name: Upload ckrv binary
        uses: actions/upload-artifact@v4
        with:
          name: ckrv-binary
          path: target/release/ckrv
          retention-days: 1

  # ── Frontend Lint ──────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - name: ESLint
        run: npm run lint
        working-directory: crates/ckrv-ui/frontend

  # ── Frontend Typecheck ─────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - name: TypeScript check
        run: npx tsc -b
        working-directory: crates/ckrv-ui/frontend

  # ── Frontend Build ─────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - name: Vite production build
        run: npm run build
        working-directory: crates/ckrv-ui/frontend

  # ── Frontend Unit Tests ─────────────────────────────────────────────
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - name: Run Vitest
        run: npx vitest --run --coverage
        working-directory: crates/ckrv-ui/frontend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: crates/ckrv-ui/frontend/coverage/
          retention-days: 14

  # ── Frontend E2E Tests (sharded) ─────────────────────────────────────
  frontend-e2e:
    name: "Frontend E2E Tests (${{ matrix.shard }})"
    needs: [rust-build]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download ckrv binary
        uses: actions/download-artifact@v4
        with:
          name: ckrv-binary
          path: ./bin
      - name: Make binary executable
        run: chmod +x ./bin/ckrv
      - name: Prepare isolated test project
        run: |
          TEST_PROJECT=$(mktemp -d)
          cd "$TEST_PROJECT"
          git init
          git config user.email "ci@test.com"
          git config user.name "CI"
          mkdir -p .specs/test-feature .chakravarti

          # Create minimal spec artifacts so all Code page tabs are unlocked
          cat > .specs/test-feature/spec.yaml << 'SPEC'
          id: test-feature
          overview: Test feature for E2E
          status: draft
          user_stories: []
          requirements: { functional: [] }
          success_criteria: []
          SPEC

          cat > .specs/test-feature/design.md << 'DESIGN'
          # Test Design
          Placeholder design for E2E tests.
          DESIGN

          cat > .specs/test-feature/tasks.yaml << 'TASKS'
          tasks:
            - id: T001
              phase: Setup
              title: Test task
              description: Placeholder
              file: src/main.rs
              user_story: null
              parallel: false
              complexity: 1
              model_tier: standard
              estimated_tokens: 1000
              risk: low
              context_required: []
              status: pending
          TASKS

          cat > .specs/test-feature/plan.yaml << 'PLAN'
          batches:
            - id: setup
              name: Setup
              task_ids: [T001]
              depends_on: []
              model_assignment:
                default: claude
                overrides: {}
              execution_strategy: sequential
              estimated_time: 1m
              reasoning: Single task batch
          PLAN

          echo '{"name":"test-project","version":"1.0.0"}' > package.json
          git add . && git commit -m "init"
          echo "CKRV_PROJECT_ROOT=$TEST_PROJECT" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install
        working-directory: crates/ckrv-ui/frontend
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: crates/ckrv-ui/frontend
      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}
        working-directory: crates/ckrv-ui/frontend
        env:
          CKRV_BINARY: ${{ github.workspace }}/bin/ckrv
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: crates/ckrv-ui/frontend/playwright-report/
          retention-days: 14
