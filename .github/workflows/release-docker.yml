name: Release Docker Agent Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override image tag (default: version from git tag)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Build and push all agent Docker images to GHCR
  # ──────────────────────────────────────────────────────────────────────
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ckrv-claude
            dockerfile: docker/Dockerfile.claude
            context: docker/

          - name: ckrv-codex
            dockerfile: docker/Dockerfile.codex
            context: docker/

          - name: ckrv-kilo
            dockerfile: docker/Dockerfile.kilo
            context: docker/

          - name: ckrv-agent
            dockerfile: docker/Dockerfile.agent
            context: docker/

          - name: ckrv
            dockerfile: docker/Dockerfile.ckrv
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: version
        run: |
          if [ -n "${{ inputs.tag_override }}" ]; then
            echo "version=${{ inputs.tag_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            # version tag (e.g. 0.2.0)
            type=semver,pattern={{version}}
            # major.minor (e.g. 0.2)
            type=semver,pattern={{major}}.{{minor}}
            # latest on every tagged release
            type=raw,value=latest,enable={{is_default_branch}}
            # always tag latest on tag push
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
