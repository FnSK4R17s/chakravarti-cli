[workspace]
resolver = "2"
members = [
    "crates/ckrv-cli",
    "crates/ckrv-core",
    "crates/ckrv-spec",
    "crates/ckrv-git",
    "crates/ckrv-sandbox",
    "crates/ckrv-model",
    "crates/ckrv-verify",
    "crates/ckrv-metrics",
    "crates/ckrv-integrations",
    "crates/ckrv-transport",
    "crates/ckrv-ui",
    "crates/ckrv-mcp",
    "crates/ckrv-tauri",
]

[workspace.package]
version = "0.3.0" # x-release-please-version
edition = "2021"
authors = ["Chakravarti CLI Contributors"]
license = "MIT"
repository = "https://github.com/FnSK4R17s/chakravarti-cli"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Git operations
git2 = "0.18"

# Docker/container operations
bollard = "0.16"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async trait
async-trait = "0.1"

# Futures utilities
futures-util = "0.3"

# Environment file loading
dotenvy = "0.15"

# Testing
tempfile = "3.9"

# Prompt templating
handlebars = "6.2"

# Shell escaping
shell-escape = "0.1"

# Internal crates
ckrv-core = { path = "crates/ckrv-core" }
ckrv-spec = { path = "crates/ckrv-spec" }
ckrv-git = { path = "crates/ckrv-git" }
ckrv-sandbox = { path = "crates/ckrv-sandbox" }
ckrv-model = { path = "crates/ckrv-model" }
ckrv-verify = { path = "crates/ckrv-verify" }
ckrv-metrics = { path = "crates/ckrv-metrics" }
ckrv-integrations = { path = "crates/ckrv-integrations" }
ckrv-cli = { path = "crates/ckrv-cli" }
ckrv-transport = { path = "crates/ckrv-transport" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# ── Pedantic/nursery lints allowed for now ──
# These are aspirational but too noisy to enforce in CI today.
# Remove these allows as code quality improves.
missing_const_for_fn = "allow"      # nursery: frequent false positives
must_use_candidate = "allow"        # pedantic: noisy on builders/constructors
return_self_not_must_use = "allow"  # pedantic: same category as must_use
uninlined_format_args = "allow"     # pedantic: style preference
doc_markdown = "allow"              # pedantic: too strict for doc formatting
missing_errors_doc = "allow"        # pedantic: # Errors on every Result fn
unnecessary_literal_bound = "allow" # nursery: lifetime bound suggestions
cast_possible_truncation = "allow"  # pedantic: intentional u128→u64 casts
cast_precision_loss = "allow"       # pedantic: u64→f64 for display/stats
cast_sign_loss = "allow"            # pedantic: intentional i32→u32 casts
cast_lossless = "allow"             # pedantic: u32→f64 infallible casts
too_many_lines = "allow"            # pedantic: function length limits
too_many_arguments = "allow"        # pedantic: function arg limits
map_unwrap_or = "allow"             # pedantic: style preference
doc_link_with_quotes = "allow"      # pedantic: doc link formatting
struct_field_names = "allow"        # pedantic: field postfix matching
missing_panics_doc = "allow"        # pedantic: # Panics section
must_use_unit = "allow"             # pedantic: #[must_use] on () return
struct_excessive_bools = "allow"    # pedantic: bool field count
